name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@b27f5d5d494a6ec30f5ec91850f32a1e6859b29f # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
