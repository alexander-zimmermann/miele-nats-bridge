name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@86cf9d84b5ed6eea313ca24d46af72d1deaa9ec1 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
