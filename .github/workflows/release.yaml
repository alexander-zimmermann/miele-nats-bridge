name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@46d7d52164a5477b54b6a23c3c5f5d6b4d7bbdab # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
