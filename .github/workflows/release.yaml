name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@d6d48b5a5e1a61147e0283fe0a9d929a24e88c3a # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
