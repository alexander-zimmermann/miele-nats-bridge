name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@837d5880b1a9fdd4d21d3ef647cf211c994a3a04 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
