name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@9ae9f910a35f976d3f1cb3d21f680e423e4dfb69 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
