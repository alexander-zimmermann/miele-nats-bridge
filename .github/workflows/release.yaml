name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@fcf0d202af4071e9d3e827a66c73bf711eb3ff74 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
