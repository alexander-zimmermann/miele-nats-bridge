name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@027c3cc3f01ed56bd7c096dfc0ae07429835ff8e # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
