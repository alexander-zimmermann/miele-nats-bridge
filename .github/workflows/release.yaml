name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@7401ebb93faf16d9b5b52af3c53d806bdc2ffac5 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
