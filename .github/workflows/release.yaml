name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@4bbb3dac1463e376e4c61e849e5aaa0d8cd1be6d # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
