name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@8f90075daf414b5c9b39bfe3b7f78b8abf47cad7 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
