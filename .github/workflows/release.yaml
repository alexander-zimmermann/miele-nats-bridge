name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@3b3726c831f4f42ebe621091d3db1fb1c0139cd7 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
