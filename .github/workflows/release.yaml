name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@d161c9982cf3d8af5ef94d0f096777bd4cbf8f3f # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
