[project]
name = "miele-nats-bridge"
version = "0.11.0"
description = "Bridge Miele kitchen appliances (3rd Party Cloud API, SSE) to NATS JetStream"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.15.2"
authors = [
    { name = "Alexander Zimmermann" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Home Automation",
]
dependencies = [
    "httpx>=0.28.1",
    "nats-bridge-core @ git+https://github.com/alexander-zimmermann/nats-bridge-core@v0.10.0",
    "httpx-sse>=0.4.3",
    "nats-py[nkeys]>=2.16.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "respx>=0.23.1",
    "types-PyYAML",
]

[project.scripts]
miele-nats-bridge = "miele_nats_bridge.main:run"
miele-cloud-auth = "miele_nats_bridge.tools.cloud_auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# nats-bridge-core is a git tag, not a PyPI release.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/miele_nats_bridge"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG"]

[tool.mypy]
python_version = "3.15"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
